name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Download ARM64 Libretro cores
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          BASE_URL="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a"
          for CORE in gambatte_libretro_android.so mgba_libretro_android.so melonds_libretro_android.so azahar_libretro.so; do
            curl -fsSL "$BASE_URL/${CORE}.zip" -o "${CORE}.zip"
            unzip -o "${CORE}.zip"
            rm -f "${CORE}.zip"
            if [ -f "${CORE}" ] && [[ "${CORE}" != lib* ]]; then
              mv "${CORE}" "lib${CORE}"
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroHandheld-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
